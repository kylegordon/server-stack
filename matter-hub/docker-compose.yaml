include:
  - ../common/networks.yaml

volumes:
    home-assistant-matter-hub:
      driver: local
      driver_opts:
        type: nfs4
        o: addr=172.24.32.5,rw
        device: ":/srv/nfs4/docker_nfs/matter-hub/"

services:
  matter-hub:
    image: ghcr.io/riddix/home-assistant-matter-hub:2.0.55
    network_mode: host
    # networks:
    #   - traefik_proxy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - home-assistant-matter-hub:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.matter-hub.rule=Host(`matter-hub.viewpoint.house`)
      - traefik.http.routers.matter-hub.entrypoints=web
      # network_mode: host means there's no container network for Traefik to
      # discover an IP from, so the backend is pinned to the host explicitly.
      - traefik.http.services.matter-hub.loadbalancer.server.url=http://172.24.32.13:8482
      - traefik.http.services.matter-hub.loadbalancer.healthcheck.hostname=172.24.32.13
      - traefik.http.services.matter-hub.loadbalancer.healthcheck.port=8482