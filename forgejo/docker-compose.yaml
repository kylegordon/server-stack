include:
  - ../common/networks.yaml

networks:
  forgejo:
    driver: bridge

volumes:
  forgejo_data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/srv/nfs4/docker_nfs/forgejo/data/"
  forgejo_db_data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/srv/nfs4/docker_nfs/forgejo/postgres/"

services:

  db:
    image: docker.io/library/postgres:18.4-alpine
    container_name: forgejo-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=forgejo
    volumes:
      - forgejo_db_data:/var/lib/postgresql
    networks:
      - forgejo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    labels:
      - traefik.enable=false

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.2
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=${POSTGRES_USER}
      - FORGEJO__database__PASSWD=${POSTGRES_PASSWORD}
      - FORGEJO__server__DOMAIN=git.viewpoint.house
      - FORGEJO__server__ROOT_URL=https://git.viewpoint.house/
      - FORGEJO__server__SSH_DOMAIN=git.viewpoint.house
      - FORGEJO__server__SSH_PORT=2222
      - TZ=Europe/London
    volumes:
      - forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2222:22"
    networks:
      - forgejo
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.forgejo.rule=Host(`git.viewpoint.house`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      - homepage.group=Infrastructure
      - homepage.name=Forgejo
      - homepage.icon=mdi-git
      - homepage.href=https://git.viewpoint.house
      - homepage.description=Git Hosting
