---
include:
  - ../common/networks.yaml

# Database stack networks, so borgmatic can dump each DB over TCP using its
# container name as hostname (same pattern as pgadmin/phpmyadmin). Postgres and
# MariaDB only: the image has no Mongo client tools.
networks:
  nautobot_net:
    external: true
    name: nautobot_nautobot
  infisical_net:
    external: true
    name: infisical_infisical
  immich_net:
    external: true
    name: immich_immich
  dawarich_net:
    external: true
    name: dawarich_dawarich
  forgejo_net:
    external: true
    name: forgejo_forgejo
  paperless_net:
    external: true
    name: paperless_paperless
  photoprism_net:
    external: true
    name: photoprism_photoprism
  # Private network for this stack's own Redis. internal: no outside access.
  borgmatic_ui_redis:
    internal: true

volumes:
  borgmatic_ui_config:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/srv/nfs4/docker_nfs/borgmatic-ui/config/"
  borgmatic_ui_data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/srv/nfs4/docker_nfs/borgmatic-ui/data/"

services:
  # Archive-listing cache only (24h TTL keys), so no volume: losing it on
  # restart just means a cold cache. Without its own Redis, borgmatic-ui falls
  # back to hostname `redis`, which on dawarich_net is dawarich's Redis.
  borgmatic-ui-redis:
    image: docker.io/library/redis:8.10.3-alpine
    container_name: borgmatic-ui-redis
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    networks:
      - borgmatic_ui_redis
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: gelf
      options:
        gelf-address: "udp://172.24.32.13:12201"
        tag: "{{.Name}}"

  borgmatic-ui:
    image: ghcr.io/speedbitsinfinitytools/borgmatic-ui:1.0.70
    container_name: borgmatic-ui
    restart: unless-stopped
    depends_on:
      - borgmatic-ui-redis
    networks:
      - borgmatic_ui_redis
      - traefik_proxy
      - nautobot_net
      - infisical_net
      - immich_net
      - dawarich_net
      - forgejo_net
      - paperless_net
      - photoprism_net
    volumes:
      - borgmatic_ui_config:/app/config
      - borgmatic_ui_data:/app/data
      # Backup sources: homeauto's own config only (/home and the volumes are NFS
      # from blackbird). No docker.sock: discovery won't work, so add DBs by hand
      # in the wizard (hostname = unique DB container/service name, e.g.
      # nautobot-postgres, paperless_db; not shared names like "db").
      - /etc:/host/etc:ro
      - /docker:/host/docker:ro
      - /usr/local:/host/usr/local:ro
      - /opt:/host/opt:ro
      - /var/spool/cron:/host/var/spool/cron:ro
    environment:
      - NODE_ENV=production
      # Explicit host: the default `redis` resolves to dawarich's Redis.
      - REDIS_HOST=borgmatic-ui-redis
      - REDIS_PORT=6379
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.borgmatic-ui-http.entrypoints=web
      - traefik.http.routers.borgmatic-ui-http.rule=Host(`borgmatic-ui.viewpoint.house`)
      - traefik.http.routers.borgmatic-ui-http.middlewares=borgmatic-ui-https
      - traefik.http.middlewares.borgmatic-ui-https.redirectscheme.scheme=https
      - traefik.http.routers.borgmatic-ui.rule=Host(`borgmatic-ui.viewpoint.house`)
      - traefik.http.routers.borgmatic-ui.entrypoints=websecure
      - traefik.http.routers.borgmatic-ui.tls=true
      - traefik.http.routers.borgmatic-ui.tls.certresolver=letsencrypt
      - traefik.http.services.borgmatic-ui.loadbalancer.server.port=8000
      - traefik.http.services.borgmatic-ui.loadbalancer.healthcheck.port=8000
      - traefik.http.services.borgmatic-ui.loadbalancer.healthcheck.path=/api/health
      - homepage.group=Storage
      - homepage.icon=mdi-backup-restore
      - homepage.name=Borgmatic UI
      - homepage.href=https://borgmatic-ui.viewpoint.house
      - homepage.description=Borg Backup Web UI
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: gelf
      options:
        gelf-address: "udp://172.24.32.13:12201"
        tag: "{{.Name}}"
