---
volumes:
  periphery_data:

services:
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    container_name: komodo-periphery-blackbird
    init: true
    # Reading host processes through /proc needs ptrace read access: docker-default denies it
    # (~87k kernel audit lines/day) and without SYS_PTRACE the kernel still refuses it silently.
    # Same as octoprint; the docker.sock mount already makes this container root-equivalent.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - periphery_data:/etc/komodo
    env_file:
      - .env
    ports:
      - "8120:8120"
    environment:
      # Periphery Configuration
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PASSKEYS: ${KOMODO_PASSKEY}
      PERIPHERY_DISABLE_TERMINALS: ${PERIPHERY_DISABLE_TERMINALS:-false}

      # Timezone
      TZ: ${TZ:-Europe/London}
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: "udp://172.24.32.13:12201"
        tag: "{{.Name}}"
    labels:
      - komodo.skip=
