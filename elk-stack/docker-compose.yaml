
include:
  - ../common/networks.yaml

volumes:

  logstash_config:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/srv/nfs4/docker_nfs/logstash/config/"

  data01:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/media/Tank/Elasticsearch/data01/"
      # device: ":/var/lib/libvirt/kvm_ssd/elasticsearch/data01/"
  data02:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/media/Tank/Elasticsearch/data02/"
      # device: ":/var/lib/libvirt/kvm_ssd/elasticsearch/data02/"
  data03:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=172.24.32.5,rw
      device: ":/media/Tank/Elasticsearch/data03/"

networks:
  elastic:
    driver: bridge

configs:
  logstash_yml:
    content: |
      # Shouldn't all this go in the docker environment variables anyway?

      #path.data: /var/lib/logstash
      pipeline.batch.size: 100
      path.logs: /var/log/logstash
      xpack.monitoring.enabled: true
      xpack.monitoring.elasticsearch.hosts: ["http://es01:9200", "http://es02:9200"]

      #modules_setup: true
      #modules:
      #  - name: netflow
      #    var.input.udp.port: 9995
      #    var.elasticsearch.hosts: [ "http://es01:9200", "http://es02:9200", "http://es03:9200" ]
      #    var.elasticsearch.ssl.enabled: false
      #    var.kibana.host: kibana01:5601
      #    var.kibana.scheme: http
      #    var.kibana.ssl.enabled: false
      #    var.kibana.ssl.verification_mode: disable
  logstash_pipelines_yml:
    content: |
      # This file is where you define your pipelines. You can define multiple.
      # For more information on multiple pipelines, see the documentation:
      #   https://www.elastic.co/guide/en/logstash/current/multiple-pipelines.html

      - pipeline.id: syslog
        path.config: "/usr/share/logstash/pipelines/syslog.conf"
      - pipeline.id: gelf
        path.config: "/usr/share/logstash/pipelines/gelf.conf"
      - pipeline.id: fluentd
        path.config: "/usr/share/logstash/pipelines/fluentd.conf"
      - pipeline.id: esphome
        path.config: "/usr/share/logstash/pipelines/syslog-esphome.conf"
      - pipeline.id: opnsense
        path.config: "/usr/share/logstash/pipelines/syslog-opnsense.conf"
      #- pipeline.id: netflow
      #  path.config: "/usr/share/logstash/pipelines/netflow.conf"
  logstash_syslog:
    content: |+
      input {
        tcp {
          port => 5514
          tags => [ "syslog", "syslog-tcp", "logging" ]
        }
        udp {
          port => 5514
          tags => [ "syslog", "syslog-udp", "logging" ]
        }
      }

      filter {
        if "syslog" in [tags] {
          grok {
            match => ["message", "%{HAPROXYHTTP}"]
            match => ["message", "%{HAPROXYTCP}"]
            match => ["message", "(?m)<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" ]
            add_field => [ "received_at", "%{@timestamp}" ]
            #add_tag => [ "haproxy" ]
          }

          if [program] == "haproxy" {
            mutate { add_tag => [ "haproxy" ] }
          }

          date {
            # Set the Logstash @timestamp field during entry into Elasticsearch
            match => [ "syslog_timestamp", "MMM dd HH:mm:ss",
            "MMM  d HH:mm:ss", "ISO8601" ]
          }

          # Delete message to save space if parsing is successful
          #if "_grokparsefailure" not in [tags] {
          #  mutate { remove_field => "message" }
          #}

          #grok {
          # match => ["host", "10.200.0.5"]
          # add_tag => [ "fortinet" ]
          #}
          #grok {
          # match => ["host", "10.2.3.6"]
          # add_tag => [ "fortimail" ]
          #}
          #grok {
          # match => ["host", "10.2.3.8"]
          # add_tag => [ "pfsense", "fw1" ]
          #}
          #grok {
          # match => ["host", "10.2.3.9"]
          # add_tag => [ "pfsense", "fw2" ]
          #}
        }

      }

      output {
        elasticsearch {
          hosts => [ "es01", "es02" ]
          #index => "logstash-%{+YYYY.MM.dd}"
        }
      }

  logstash_gelf:
    content: |+
      input {
        gelf {
          port => 12201
          tags => [ "gelf" ]
        }
      }

      filter {
        if "gelf" in [tags] {
          mutate {

            # From https://discuss.elastic.co/t/how-to-trim-zero-or-more-leading-and-trailing-spaces-from-key-value-pairs/117933/8
            gsub => [
              "message", "^\s*", "",
              "message", "\s*$$", ""
            ]
          }

          # GELF "host" is a string but ECS maps host as an object; move into ECS fields.
          mutate {
            rename => {
              "host"           => "[host][name]"
              "container_name" => "[container][name]"
              "container_id"   => "[container][id]"
              "image_name"     => "[container][image][name]"
            }
          }
        }

        if [tag] == "influxdb" {
          if "httpd" in [message] {
            grok {
              match => { "message" => "%{HTTPD_COMMONLOG}" }
            }
            date {
              match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
            }
          } else {
            kv {}
            date {
              match => [ "ts", ISO8601 ]
            }
            if [verb] {
              kv {
                source => "request"
                field_split => "\&"
              }
              mutate { rename => [ "db", "db_instance" ] }
            }
          }

          # Delete message to save space if parsing is successful
          #if "_grokparsefailure" not in [tags] {
          #  mutate { remove_field => "message" }
          #}

          # Delete timestamp to save space if parsing is successful
          #if "_dateparsefailure" not in [tags] {
          #  mutate { remove_field => [ "ts", "timestamp" ] }
          #}
        }
      }

      output {
        elasticsearch {
          hosts => [ "es01", "es02" ]
          data_stream => "true"
          data_stream_type => "logs"
          data_stream_dataset => "docker"
          data_stream_namespace => "default"
        }
      }

  logstash_fluentd:
    content: |+
      input {
        tcp {
          codec => fluent
          port => 4000
          tags => [ "fluentd" ]
        }
      }

      output {
        elasticsearch {
          hosts => [ "es01", "es02" ]
          #index => "logstash-%{+YYYY.MM.dd}"
        }
      }

  logstash_esphome:
    content: |+
      input {
        tcp {
          port => 515
          tags => [ "esphome", "esphome-tcp", "logging" ]
        }
        udp {
          port => 515
          tags => [ "esphome", "esphome-udp", "logging" ]
        }
      }

      filter {
        if "esphome" in [tags] {
          grok {
            # This was the original
            match => ["message", "(?m)<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" ]
            # Below is from https://www.elastic.co/guide/en/logstash/current/config-examples.html
            #match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }

            add_field => [ "received_at", "%{@timestamp}" ]


            # void SyslogComponent::log(uint8_t level, const std::string &tag, const std::string &payload) {
          

          }

          date {
            # Set the Logstash @timestamp field during entry into Elasticsearch
            match => [ "syslog_timestamp", "MMM dd HH:mm:ss",
            "MMM  d HH:mm:ss", "ISO8601" ]
          }

          # Delete message to save space if parsing is successful
          if "_grokparsefailure" not in [tags] {
            mutate { remove_field => "message" }
          }

        }

      }

      output {
        elasticsearch {
          hosts => [ "es01", "es02" ]
          #index => "logstash-%{+YYYY.MM.dd}"
        }
      }

  logstash_opnsense:
    content: |+
      input {
        udp {
          port => 516
          type => "opnsense"
        }
      }


      filter {
        if [type] == "opnsense" {
          grok {
            match => {
              "message" => "^<%{POSINT:log.syslog.priority}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{HOSTNAME:host.hostname} %{DATA:process.name}\[%{POSINT:process.pid}\]: %{GREEDYDATA:filterlog_payload}"
            }
          }

          csv {
            source => "filterlog_payload"
            separator => ","
            skip_empty_columns => true
            columns => [
              "rule_number","subrule_number","anchor","tracker","network.interface.name",
              "event.reason","event.action","network.direction","network.iana_number",
              "ip.tos","ip.ecn","ip.ttl","network.id","ip.fragment_offset","ip.flags",
              "network.transport_number","network.transport","network.bytes",
              "source.ip","destination.ip","source.port","destination.port",
              "network.bytes_payload","network.tcp.flags","network.tcp.seq","network.tcp.ack",
              "network.tcp.window","network.tcp.urg","network.tcp.options"
            ]
          }

          mutate {
            convert => {
              "source.port"      => "integer"
              "destination.port" => "integer"
              "network.bytes"    => "integer"
              "ip.ttl"           => "integer"
            }
          }

          mutate {
            lowercase => [ "event.action", "network.transport", "network.direction" ]
            gsub => [ "event.action", "block", "deny" ]
          }

          date {
            match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
            timezone => "UTC"
            target => "@timestamp"
          }

          mutate {
            add_field => {
              "event.kind"     => "event"
              "event.category" => "network_traffic"
              "event.type"     => "connection"
            }
            remove_field => [ "filterlog_payload", "message", "syslog_timestamp" ]
          }

      #    # Only enrich public IPs (skip RFC1918, loopback, link-local, multicast)
      #    if [source][ip] and !([source][ip] =~ /^10\./ or [source][ip] =~ /^192\.168\./ or [source][ip] =~ /^172\.(1[6-9]|2[0-9]|3[0-1])\./ or [source][ip] =~ /^127\./ or [source][ip] =~ /^169\.254\./ or [source][ip] =~ /^fc00:/ or [source][ip] =~ /^fe80:/) {
      #      geoip {
      #        source => "[source][ip]"
      #        target => "[source][geo]"
      #        fields => [ "city_name", "continent_name", "country_iso_code", "location", "region_name" ]
      #      }
      #      geoip {
      #        source => "[source][ip]"
      #        target => "[source][as]"
      #        database => "/usr/share/GeoIP/GeoLite2-ASN.mmdb"
      #        fields => [ "asn", "organization_name" ]
      #      }
      #    }
      #
      #    if [destination][ip] and !([destination][ip] =~ /^10\./ or [destination][ip] =~ /^192\.168\./ or [destination][ip] =~ /^172\.(1[6-9]|2[0-9]|3[0-1])\./ or [destination][ip] =~ /^127\./ or [destination][ip] =~ /^169\.254\./ or [destination][ip] =~ /^fc00:/ or [destination][ip] =~ /^fe80:/) {
      #      geoip {
      #        source => "[destination][ip]"
      #        target => "[destination][geo]"
      #        fields => [ "city_name", "continent_name", "country_iso_code", "location", "region_name" ]
      #      }
      #      geoip {
      #        source => "[destination][ip]"
      #        target => "[destination][as]"
      #        database => "/usr/share/GeoIP/GeoLite2-ASN.mmdb"
      #        fields => [ "asn", "organization_name" ]
      #      }
      #    }
        }
      }

      output {
        elasticsearch {
          hosts => [ "es01", "es02" ]
          #index => "logstash-%{+YYYY.MM.dd}"
        }
      }

  filebeat_yml:
    content: |+
      filebeat.inputs:
      - type: netflow
        max_message_size: 10KiB
        host: "0.0.0.0:2055"
        protocols: [ v5, v9, ipfix ]
        expiration_timeout: 30m
        queue_size: 8192
        detect_sequence_reset: true

      - type: filestream
        id: syslog-ingest
        take_over:
          enabled: true
        paths:
          - /var/log/syslog

      - type: filestream
        id: apache2-ingest
        take_over:
          enabled: true
        paths:
          - "/var/log/apache2/*"
        fields:
          apache: true
        fields_under_root: true

      - type: filestream
        enabled: true
        id: container-logs-ingest
        prospector.scanner.symlinks: true
        parsers:
          - container: ~
        take_over:
          enabled: true
        paths:
          - /var/lib/docker/containers/*/*-json.log
        processors:
          - add_docker_metadata:
              host: "unix:///var/run/docker.sock"
          # Application JSON goes under json.* so it cannot overwrite ECS fields such as host
          - decode_json_fields:
              fields: ["message"]
              target: "json"
              overwrite_keys: false
              add_error_key: false
          # Traefik access logs are collected via OTLP; drop the duplicate stdout lines
          - drop_event:
              when:
                and:
                  - equals:
                      container.name: traefik
                  - has_fields: ["json.RequestPath"]

      processors:
        # decode the log field (sub JSON document) if JSON encoded, then maps it's fields to elasticsearch fields
        # (not for container events, which are decoded under json.* by their input)
      - decode_json_fields:
          when.not.has_fields: ["container.id"]
          fields: ["log", "message"]
          target: ""
          # overwrite existing target elasticsearch fields while decoding json fields
          overwrite_keys: true

      filebeat.config.modules:
        path: $${path.config}/modules.d/*.yml
        reload.enabled: false

      setup.kibana:
        # This hostname is a docker container name
        host: "kibana01:5601"

      setup.dashboards.enabled: true

      monitoring.enabled: true

      output.elasticsearch:
        hosts: ["es01", "es02"]
        pipeline: geoip-info
        indices:
          - index: "logs-docker-default"
            when.has_fields: ["container.id"]


services:

  cerebro:
    image: lmenezes/cerebro:0.9.4
    container_name: cerebro
    restart: unless-stopped
    networks:
      - elastic
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.cerebro.rule=Host(`cerebro.viewpoint.house`)
      - traefik.http.routers.cerebro.entrypoints=websecure
      - traefik.http.routers.cerebro.tls=true
      - traefik.http.routers.cerebro.tls.certresolver=letsencrypt
      - traefik.http.services.cerebro.loadbalancer.server.port=9000
      - homepage.group=Monitoring
      - homepage.name=Cerebro
      - homepage.icon=mdi-chip
      - homepage.href=https://cerebro.viewpoint.house
      - homepage.description=ELK - Cerebro

  elastichq:
    image: elastichq/elasticsearch-hq:latest
    container_name: elastichq
    restart: unless-stopped
    ports:
      - 5001:5000
    networks:
      - elastic
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.elastichq.rule=Host(`elastichq.viewpoint.house`)
      - traefik.http.routers.elastichq.entrypoints=websecure
      - traefik.http.routers.elastichq.tls=true
      - traefik.http.routers.elastichq.tls.certresolver=letsencrypt
      - homepage.group=Monitoring
      - homepage.name=ElasticHQ
      - homepage.icon=mdi-chip
      - homepage.href=https://elastichq.viewpoint.house
      - homepage.description=ELK - ElasticHQ

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.4
    container_name: logstash
    restart: unless-stopped
    configs:
      - source: logstash_yml
        target: /usr/share/logstash/config/logstash.yml
      - source: logstash_pipelines_yml
        target: /usr/share/logstash/config/pipelines.yml
      - source: logstash_syslog
        target: /usr/share/logstash/pipelines/syslog.conf
      - source: logstash_gelf
        target: /usr/share/logstash/pipelines/gelf.conf
      - source: logstash_fluentd
        target: /usr/share/logstash/pipelines/fluentd.conf
      - source: logstash_esphome
        target: /usr/share/logstash/pipelines/syslog-esphome.conf
      - source: logstash_opnsense
        target: /usr/share/logstash/pipelines/syslog-opnsense.conf
    ports:
      # Specifying IP as otherwise clashes with check_mk on 127.0.0.1:5000
      - "172.24.32.13:5000:5000/tcp"
      - "172.24.32.13:5000:5000/udp"
      - "9600:9600"
      - "514:5514/tcp"
      - "514:5514/udp"
      - "515:515/tcp"
      - "515:515/udp"
      - "516:516/tcp"
      - "516:516/udp"
      - "4739:4739/udp"
      - "4739:4739/tcp"
      - "12201:12201/tcp"
      - "12201:12201/udp"
      - "4000:4000"
    #healthcheck:
    #  test: logstash test config
    #  interval: 30s
    #  timeout: 15s
    #  retries: 5
    networks:
      - elastic

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.4
    container_name: filebeat
    restart: unless-stopped
    user: root #To read the docker socket
    command: ["--environment", "container"]  #TODO: Remove after 8.17.1/8.18.0
    configs:
      - source: filebeat_yml
        target: /usr/share/filebeat/filebeat.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # healthcheck:
    #   test: filebeat test config
    #   interval: 30s
    #   timeout: 15s
    #   retries: 5
    ports:
      - "2055:2055/udp"
      - "2055:2055/tcp"
    networks:
      - elastic
    logging:
      driver: gelf
      options:
        gelf-address: "udp://172.24.32.13:12201"
        tag: "{{.Name}}"
    labels:
      - traefik.enable=false

  auditbeat:
    image: docker.elastic.co/beats/auditbeat:9.5.4
    container_name: auditbeat
    restart: unless-stopped
    user: root #To read the docker socket
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    command: auditbeat -e --strict.perms=false
    pid: "host" # Set the required permissions with pid and cap_add for Auditbeat
    volumes:
      - type: bind
        source: /docker/auditbeat/config/auditbeat.yml
        target: /usr/share/auditbeat/auditbeat.yml
        read_only: true
    healthcheck:
      test: auditbeat test config
      interval: 30s
      timeout: 15s
      retries: 5
    networks:
      - elastic
    logging:
      driver: gelf
      options:
        gelf-address: "udp://172.24.32.13:12201"
        tag: "{{.Name}}"
    labels:
      - traefik.enable=false

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.4
    container_name: apm-server
    restart: unless-stopped
    depends_on:
      - es01
      - es02
      - kibana01
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
    cap_drop: ["ALL"]
    ports:
      - 8200:8200
    networks:
      - elastic
    entrypoint: /usr/share/apm-server/apm-server
    command: >
      -e
         -E apm-server.rum.enabled=true
         -E setup.kibana.host=kibana01:5601
         -E setup.template.settings.index.number_of_replicas=0
         -E apm-server.kibana.enabled=true
         -E apm-server.kibana.host=kibana01:5601
         -E output.elasticsearch.hosts='["es01:9200","es02:9200"]'
    labels:
      - traefik.enable=false
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: es01
    restart: unless-stopped
    # network_mode: host
    environment:
      - node.name=es01
      # Security disabled for now - enable by changing to ${XPACK_SECURITY_ENABLED:-true}
      # and uncomment env_file below. Requires additional setup steps.
      - xpack.security.enabled=false
      - cluster.name=${CLUSTER_NAME:-es-docker-cluster}
      - discovery.seed_hosts=${DISCOVERY_SEED_HOSTS:-es01,es02}
      - cluster.initial_master_nodes=${CLUSTER_INITIAL_MASTER_NODES:-es01,es02}
      - cluster.routing.allocation.disk.watermark.low=${CLUSTER_ROUTING_ALLOCATION_DISK_WATERMARK_LOW:-97%}
      - cluster.routing.allocation.disk.watermark.high=${CLUSTER_ROUTING_ALLOCATION_DISK_WATERMARK_HIGH:-98%}
      - cluster.routing.allocation.disk.watermark.flood_stage=${CLUSTER_ROUTING_ALLOCATION_DISK_WATERMARK_FLOOD_STAGE:-99%}
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms4g -Xmx4g}"
    # env_file:
    #   - .elk.env  # Uncomment when enabling security
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - data01:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
      - 9300:9300
    networks:
      - elastic
    labels:
      - traefik.enable=false

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: es02
    restart: unless-stopped
    # network_mode: host
    environment:
      - node.name=es02
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02
      - cluster.routing.allocation.disk.watermark.low=97%
      - cluster.routing.allocation.disk.watermark.high=98%
      - cluster.routing.allocation.disk.watermark.flood_stage=99%
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - data02:/usr/share/elasticsearch/data
    ports:
      - 9201:9200
    networks:
      - elastic
    labels:
      - traefik.enable=false

  # es03:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
  #   container_name: es03
  #   restart: unless-stopped
  #   # network_mode: host
  #   environment:
  #     - node.name=es03
  #     - cluster.name=es-docker-cluster
  #     - discovery.seed_hosts=es01,es02
  #     - cluster.initial_master_nodes=es01,es02
  #     - cluster.routing.allocation.disk.watermark.low=97%
  #     - cluster.routing.allocation.disk.watermark.high=98%
  #     - cluster.routing.allocation.disk.watermark.flood_stage=99%
  #     - xpack.security.enabled=false
  #     - bootstrap.memory_lock=true
  #     - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
  #   ulimits:
  #     memlock:
  #       soft: -1
  #       hard: -1
  #   volumes:
  #     - data03:/usr/share/elasticsearch/data
  #   ports:
  #     - 9202:9200
