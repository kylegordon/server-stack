---

networks:
  traefik_proxy:
    driver: bridge

volumes:
  traefik_letsencrypt:

services:
  traefik:
    ## Reference material ##
    # https://github.com/ironicbadger/infra/blob/master/dev/traefik/docker-compose.yaml
    # https://blog.ktz.me/traefik-v2-and-unifi-controller-in-docker/
    # https://community.traefik.io/t/healthcheck-through-traefik/10000/6
    # https://doc.traefik.io/traefik/routing/services/#health-check
    # https://gist.github.com/jeroenhendricksen/7dfe273277bbbd1c2ea2cb7c647b24fa
    image: "docker.io/library/traefik:v3.7.13"
    container_name: "traefik"
    networks:
      - traefik_proxy
    # THE WHOLE STATIC CONFIGURATION LIVES HERE, and must stay here.
    #
    # Traefik's three static-config sources — a config file, these CLI arguments, and
    # environment variables — are MUTUALLY EXCLUSIVE.  If Traefik finds a file at
    # /etc/traefik/traefik.yml|yaml|toml it reads that and silently discards this entire
    # list; nothing is logged at INFO and every flag below simply stops existing.
    # Deepcore had exactly that file for two years, so none of these arguments had ever
    # taken effect, and a router naming a resolver declared only here failed with
    # "Router uses a nonexistent certificate resolver".
    #
    # /docker/traefik is still mounted at /etc/traefik because the file *provider* reads
    # config.yml from it — that is dynamic config and is unaffected.  Keep that directory
    # free of a traefik.yaml, and put static config here, where the repo can see it.
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Dynamic config: the routers/services for lodge, glasgownet.com, www.glasgownet.com,
      # www.rlotte.me.uk and swtvc.  These live only on the host, in /docker/traefik/config.yml.
      - --providers.file.filename=/etc/traefik/config.yml
      - --providers.file.watch=true
      # Several backends behind this proxy present self-signed certificates.
      - --serverstransport.insecureskipverify=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
      - --accesslog=true
      # HTTP-01, NOT the DNS-01/Route 53 resolver homeauto uses.  Deepcore holds no AWS
      # credential (this service has no env_file, by design), and it serves names in zones
      # Route 53 does not host at all — swtvc.org, rlotte.me.uk, smart-timing.co.uk — so
      # DNS-01 could never have worked here.  The storage path is letsencrypt.json, not
      # acme.json: that store already holds eleven live certificates and renaming it would
      # reissue every one of them.
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-kyle@glasgownet.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/letsencrypt.json
      # Second resolver, separate store, for names opted in explicitly with
      # tls.certresolver=letsencrypt-http (rmonitor's live.smart-timing.co.uk).
      - --certificatesresolvers.letsencrypt-http.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt-http.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt-http.acme.email=${LETSENCRYPT_EMAIL:-kyle@glasgownet.com}
      - --certificatesresolvers.letsencrypt-http.acme.storage=/letsencrypt/acme-http.json
    ports:
      - "80:80"     # Web entrypoint
      - "443:443" # Websecure entrypoint
      - "8080:8080" # Traefik Dashboard
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - "/docker/traefik/:/etc/traefik/"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
